<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./app.js"></script>
    <style>
        body {
            font-family: sans-serif;

        }

        .grid-container {
            display: grid;

            grid-template-columns: auto auto auto ;
            grid-template-rows: 50px 100px;
            padding: 20px;
            background-color: #025955;
            border-radius: 10px;

        }
        .grid-item {
            padding: 20px;
            background-color: #Fde8cd;
            font-weight: bold;
            margin: 10px;
            border-radius: 10px;

        }


    </style>
</head>
<body>
   <div class="grid-container">
    <div class="grid-item">grid item2</div>
    <div class="grid-item">grid item3</div>
    <div class="grid-item">grid item4</div>
    <div class="grid-item">grid item5</div>
    <div class="grid-item">grid item6</div>
    <div class="grid-item">grid item7</div>
   </div>
</body>
</html>
